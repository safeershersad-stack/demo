<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Mena's Closet" />
<meta name="theme-color" content="#FFFFFF" />
<title>Mena's Closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<style>
  :root{
    --bg:#FFFFFF; --soft:#FAFAF9; --ink:#111111; --mut:#6E6E6E; --faint:#9B9B9B;
    --line:#E6E4E1; --lineSoft:#F0EEEB; --flag:#8C2F1F; --good:#2F5D45;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --display:"Cormorant Garamond",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:var(--sans);color:var(--ink)}
  a{color:inherit}
  ::selection{background:#111;color:#fff}
  .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .hoverlift{transition:opacity .18s ease}
  .hoverlift:hover{opacity:.62}
  @media (prefers-reduced-motion: reduce){ .hoverlift{transition:none} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;
const sans='var(--sans)', display='var(--display)';

/* ---------------- benchmarks ---------------- */
const BENCH = {
  "Tops":{range:"$2",mid:2,ceil:80},
  "Bottoms":{range:"$1–5",mid:3,ceil:100},
  "Sweaters & Knitwear":{range:"$3–6",mid:4.5,ceil:80},
  "Coats":{range:"$1–5",mid:3,ceil:150},
  "Jackets":{range:"$2–6",mid:4,ceil:150},
  "Dresses":{range:"$3–10",mid:6.5,ceil:40},
  "Shoes":{range:"$1–4",mid:3.5,ceil:150},
  "Workwear":{range:"$5–15",mid:10,ceil:120},
  "Special Occasionwear":{range:"$10–20",mid:15,ceil:15},
  "Accessories":{range:"$2–8",mid:5,ceil:100},
};
const CATS = ["Tops","Sweaters & Knitwear","Dresses","Bottoms","Coats","Jackets","Shoes","Accessories","Workwear","Special Occasionwear"];
const SEASONS = ["All year","Spring","Summer","Fall","Winter"];

/* ---------------- seed data ---------------- */
const SEED = [
  ["Burberry","Trench","Coats",275,125,75,"Fall"],
  ["Wardrobe NYC","Sweater","Sweaters & Knitwear",110,0,2,"Winter"],
  ["Silk & Cashmere","Triangle scarf","Accessories",130,0,20,"Winter"],
  ["Junior Galliano","Jacket","Special Occasionwear",250,0,4,"All year"],
  ["No.6 Store","Pony shoes","Shoes",400,0,5,"Fall"],
  ["Frankie Shop","Coat","Coats",400,0,25,"Winter"],
  ["","Turkey coat","Coats",400,0,5,"Winter"],
  ["Muji","Black sweater","Sweaters & Knitwear",40,0,20,"Winter"],
  ["Muji","V-neck sweater vest","Sweaters & Knitwear",20,0,10,"Fall"],
  ["Silk & Cashmere","Grey vest","Sweaters & Knitwear",300,0,15,"Fall"],
  ["SWDN","Sweater (Cueva)","Sweaters & Knitwear",185,0,1,"Winter"],
  ["Sundae School","Chinos","Workwear",120,0,1,"All year"],
  ["Uniqlo","Culottes","Bottoms",20,0,5,"Summer"],
  ["GU","Jeans","Bottoms",20,0,3,"All year"],
  ["Asket","Culottes","Bottoms",100,0,20,"All year"],
  ["Asket","Striped dress","Dresses",100,0,5,"Summer"],
  ["Asket","Vest with ribbons","Tops",80,0,5,"All year"],
  ["Snow Peak","Jacket","Jackets",150,0,100,"All year"],
  ["Snow Peak","Skirt","Bottoms",80,0,14,"All year"],
  ["Issey Miyake","Sweater, blue/black","Sweaters & Knitwear",80,0,3,"Winter"],
  ["Issey Miyake","Sweater, silver","Sweaters & Knitwear",100,0,2,"Winter"],
  ["Haruta","Spock shoes","Shoes",40,0,1,"All year"],
  ["","Japan dress pants","Workwear",100,0,1,"All year"],
  ["","Japan beret","Accessories",70,0,2,"Fall"],
  ["","French hat","Accessories",80,0,1,"All year"],
  ["","Pink dress, UK","Dresses",110,0,4,"Summer"],
  ["Simone Rocha","Crocs clogs","Shoes",200,0,50,"All year"],
  ["Simone Rocha","Crocs heels","Shoes",300,0,4,"All year"],
  ["","Boyfriend shirt, double collar","Tops",100,0,4,"All year"],
  ["","Boyfriend shirt, tie around","Tops",100,0,0,"All year"],
  ["","Boyfriend shirt pants, wide","Bottoms",150,0,10,"All year"],
  ["","Boyfriend shirt pants, tapered","Bottoms",150,0,2,"All year"],
  ["& Other Stories","White shirt","Workwear",70,0,0,"All year"],
  ["Maison Margiela","Replica slip dress","Dresses",200,0,10,"Summer"],
  ["IF Soho","Blazer","Workwear",200,0,2,"All year"],
  ["Yohji Yamamoto","Dress, IF Soho","Special Occasionwear",950,0,1,"All year"],
  ["Y's","Dress, Japan","Dresses",80,0,2,"All year"],
  ["Uniqlo x JW Anderson","Heavy knit, blue","Sweaters & Knitwear",70,0,10,"Winter"],
  ["Uniqlo x JW Anderson","Heavy knit, beige","Sweaters & Knitwear",70,0,5,"Winter"],
  ["Uniqlo x JW Anderson","Light knit, stripes","Tops",40,0,10,"Spring"],
  ["Rag & Bone","Pink dress shirt","Workwear",80,0,8,"All year"],
  ["Cecilie Bahnsen","Black party dress","Special Occasionwear",600,200,8,"All year"],
  ["Not Conventional","Culottes, Kyoto","Bottoms",150,0,0,"All year"],
  ["Not Conventional","Pleated shirt, Kyoto","Tops",150,0,0,"All year"],
  ["Valentino","Dress, Rome","Special Occasionwear",100,100,4,"All year"],
  ["","Rome vintage dress","Dresses",80,0,4,"Summer"],
].map((r,i)=>({
  id:i, brand:r[0], name:r[1], category:r[2], price:r[3], care:r[4],
  baseWears:r[5], season:r[6], resale:0, cleanCost:0, img:"", history:[]
}));

/* ---------------- persistence ---------------- */
const KEY="menas_closet_v3";
const store={
  async get(k){ try{ if(window.storage){const r=await window.storage.get(k); return r&&r.value?r.value:null;} }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){ return null; } },
  async set(k,v){ try{ if(window.storage){ await window.storage.set(k,v); return; } }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){} }
};
function idbOpen(){return new Promise((res,rej)=>{let q;try{q=indexedDB.open("closet_media",1);}catch(e){return rej(e);}
  q.onupgradeneeded=()=>{const d=q.result; if(!d.objectStoreNames.contains("outfits"))d.createObjectStore("outfits",{keyPath:"id",autoIncrement:true});};
  q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);});}
async function idbAll(n){const db=await idbOpen();return new Promise((res,rej)=>{const o=[];const c=db.transaction(n).objectStore(n).openCursor();
  c.onsuccess=e=>{const k=e.target.result; if(k){o.push(k.value);k.continue();}else res(o);}; c.onerror=()=>rej(c.error);});}
async function idbPut(n,v){const db=await idbOpen();return new Promise((res,rej)=>{const r=db.transaction(n,"readwrite").objectStore(n).put(v);
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function idbDel(n,k){const db=await idbOpen();return new Promise((res,rej)=>{const r=db.transaction(n,"readwrite").objectStore(n).delete(k);
  r.onsuccess=()=>res(); r.onerror=()=>rej(r.error);});}
function fileToThumb(file,max,q){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const w=Math.round(img.width*s),h=Math.round(img.height*s);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
    try{res(cv.toDataURL("image/jpeg",q||0.82));}catch(e){rej(e);} };
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"));}; img.src=u;});}

/* ---------------- helpers ---------------- */
const money=n=>n==null?"—":"$"+Number(n).toLocaleString(undefined,{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
const todayISO=()=>new Date().toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
function seasonNow(){const m=new Date().getMonth();return m<2||m===11?"Winter":m<5?"Spring":m<8?"Summer":"Fall";}
function dormancy(it){ if(!it.history.length) return null; const last=it.history[it.history.length-1]; return daysBetween(last,todayISO()); }
function lastWornLabel(it){
  const d=dormancy(it);
  if(d===null) return it.baseWears>0?"No date logged":"Never worn";
  if(d<=0) return "Worn today"; if(d===1) return "Worn yesterday";
  if(d<30) return `${d} days ago`;
  const mo=Math.round(d/30); return mo<12?`${mo} mo ago`:`${Math.round(d/365)} yr ago`;
}
function derive(it){
  const b=BENCH[it.category]||{range:"—",mid:5,ceil:80};
  const wears=(it.baseWears||0)+it.history.length;
  const total=(+it.price||0)+(+it.care||0);
  const cpw=wears>0?total/wears:Infinity;
  const targetWears=Math.ceil(total/b.mid);
  const gap=Math.max(0,targetWears-wears);
  const reachable=targetWears<=b.ceil;
  const status=(wears>0&&cpw<=b.mid)?"star":(reachable?"improve":"sell");
  return {...it,wears,total,cpw,targetWears,gap,reachable,status,mid:b.mid,range:b.range,ceil:b.ceil,dormant:dormancy(it)};
}

/* ---------------- primitives ---------------- */
function Money({v,size=15,weight=500}){return <span style={{fontSize:size,fontWeight:weight,letterSpacing:"-0.01em"}}>{v===Infinity?"—":money(r2(v))}</span>;}
function Tag({children,tone}){
  const c=tone==="flag"?"var(--flag)":tone==="good"?"var(--good)":"var(--mut)";
  return <span style={{fontSize:10,letterSpacing:".1em",textTransform:"uppercase",color:c,border:`1px solid ${c==="var(--mut)"?"var(--line)":c}`,padding:"3px 7px",whiteSpace:"nowrap"}}>{children}</span>;
}
function Thumb({src,ratio="1 / 1",label}){
  return src
    ? <img src={src} alt="" style={{width:"100%",aspectRatio:ratio,objectFit:"cover",display:"block",background:"var(--soft)"}}/>
    : <div style={{width:"100%",aspectRatio:ratio,background:"var(--soft)",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <span style={{fontFamily:display,fontSize:26,color:"#D8D5D0"}}>{label||"—"}</span></div>;
}
function Lead({children}){return <p style={{fontSize:14,color:"var(--mut)",lineHeight:1.7,maxWidth:"64ch",margin:"0 0 26px"}}>{children}</p>;}
function SectionRule({children,right}){
  return <div style={{display:"flex",alignItems:"center",gap:14,margin:"0 0 16px"}}>
    <div className="lbl" style={{whiteSpace:"nowrap"}}>{children}</div>
    <div style={{flex:1,height:1,background:"var(--line)"}}/>
    {right&&<div className="lbl" style={{whiteSpace:"nowrap"}}>{right}</div>}
  </div>;
}
function Empty({children}){return <div style={{border:"1px solid var(--line)",padding:"46px 20px",textAlign:"center",color:"var(--mut)",fontSize:13.5}}>{children}</div>;}

/* ---------------- app ---------------- */
function App(){
  const [tab,setTab]=useState("closet");
  const [raw,setRaw]=useState(null);
  const [outfits,setOutfits]=useState([]);
  const [editing,setEditing]=useState(null);
  const [toast,setToast]=useState("");

  useEffect(()=>{(async()=>{
    const s=await store.get(KEY);
    if(s){ try{ setRaw(JSON.parse(s)); }catch(e){ setRaw(SEED); } } else setRaw(SEED);
    try{ setOutfits((await idbAll("outfits")).sort((a,b)=>b.ts-a.ts)); }catch(e){}
  })();},[]);
  useEffect(()=>{ if(raw) store.set(KEY,JSON.stringify(raw)); },[raw]);

  function flash(m){ setToast(m); setTimeout(()=>setToast(""),1800); }
  const items=useMemo(()=>raw?raw.map(derive):[],[raw]);

  function logWear(id,delta=1){
    setRaw(rs=>rs.map(r=>{
      if(r.id!==id) return r;
      if(delta>0) return {...r,history:[...r.history,todayISO()]};
      if(r.history.length) return {...r,history:r.history.slice(0,-1)};
      return {...r,baseWears:Math.max(0,(r.baseWears||0)-1)};
    }));
  }
  function logClean(id){
    setRaw(rs=>rs.map(r=>r.id===id?{...r,care:(+r.care||0)+(+r.cleanCost||0)}:r));
    flash("Cleaning cost added");
  }
  function saveItem(v){
    setRaw(rs=>{
      if(v.id==null){ const id=rs.reduce((m,r)=>Math.max(m,r.id),-1)+1;
        return [...rs,{...v,id,history:[],baseWears:+v.baseWears||0}]; }
      return rs.map(r=>r.id===v.id?{...r,...v}:r);
    });
    setEditing(null); flash(v.id==null?"Piece added":"Piece updated");
  }
  function deleteItem(id){ setRaw(rs=>rs.filter(r=>r.id!==id)); setEditing(null); flash("Piece removed"); }

  async function addOutfit(f){ try{ const src=await fileToThumb(f,1100,.82); const rec={src,ts:Date.now()};
    const id=await idbPut("outfits",rec); setOutfits(o=>[{...rec,id},...o]); }catch(e){} }
  async function delOutfit(id){ try{ await idbDel("outfits",id); setOutfits(o=>o.filter(x=>x.id!==id)); }catch(e){} }

  function exportJSON(){
    const blob=new Blob([JSON.stringify(raw,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`menas-closet-${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
  }
  function importJSON(file){
    const fr=new FileReader();
    fr.onload=()=>{ try{ const d=JSON.parse(fr.result);
      if(Array.isArray(d)){ setRaw(d.map(x=>({history:[],baseWears:0,resale:0,cleanCost:0,img:"",season:"All year",...x}))); flash("Closet restored"); } }
      catch(e){ flash("Could not read that file"); } };
    fr.readAsText(file);
  }

  const stats=useMemo(()=>{
    const spend=items.reduce((s,i)=>s+i.total,0);
    const worn=items.filter(i=>i.wears>0);
    const avg=worn.length?worn.reduce((s,i)=>s+i.cpw,0)/worn.length:0;
    return {spend,avg,never:items.filter(i=>i.wears===0).length,count:items.length};
  },[items]);

  if(!raw) return <div style={{padding:60,textAlign:"center",color:"var(--faint)"}}>Opening the closet…</div>;

  const TABS=[["closet","Closet"],["today","Get dressed"],["underused","Underused"],["rotate","Rotate in"],["sell","Sell or keep"],["lookbook","Lookbook"]];

  return (
    <div>
      {/* masthead */}
      <div style={{borderBottom:"1px solid var(--line)",textAlign:"center",padding:"26px 20px 0"}}>
        <div style={{fontFamily:display,fontSize:34,fontWeight:400,letterSpacing:".2em",textIndent:".2em",lineHeight:1}}>MENA&rsquo;S CLOSET</div>
        <div className="lbl" style={{marginTop:9}}>Cost per wear &middot; {stats.count} pieces</div>
        <div style={{display:"flex",justifyContent:"center",gap:0,flexWrap:"wrap",marginTop:20}}>
          {TABS.map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)} className="hoverlift" style={{
              fontSize:11.5,letterSpacing:".13em",textTransform:"uppercase",padding:"12px 15px",
              color:tab===k?"var(--ink)":"var(--mut)",borderBottom:tab===k?"1.5px solid var(--ink)":"1.5px solid transparent",marginBottom:-1}}>{l}</button>
          ))}
          <button onClick={()=>setEditing({})} className="hoverlift" style={{fontSize:11.5,letterSpacing:".13em",textTransform:"uppercase",padding:"12px 15px",color:"var(--mut)"}}>+ Add</button>
        </div>
      </div>

      <div style={{maxWidth:1180,margin:"0 auto",padding:"30px 22px 90px"}}>
        {/* ledger strip */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",borderTop:"1px solid var(--line)",borderBottom:"1px solid var(--line)",marginBottom:34}}>
          {[["Invested",money(stats.spend)],["Average CPW",money(r2(stats.avg))],["Never worn",stats.never],["Season",seasonNow()]].map(([l,v],i)=>(
            <div key={l} style={{padding:"16px 18px",borderLeft:i?"1px solid var(--lineSoft)":"none"}}>
              <div className="lbl">{l}</div>
              <div style={{fontFamily:display,fontSize:25,marginTop:4}}>{v}</div>
            </div>
          ))}
        </div>

        {tab==="closet" && <Closet items={items} onEdit={setEditing} logWear={logWear} exportJSON={exportJSON} importJSON={importJSON}/>}
        {tab==="today" && <Today items={items} logWear={logWear} onEdit={setEditing}/>}
        {tab==="underused" && <Underused items={items} logWear={logWear} onEdit={setEditing}/>}
        {tab==="rotate" && <Rotate items={items} logWear={logWear}/>}
        {tab==="sell" && <Sell items={items} onEdit={setEditing}/>}
        {tab==="lookbook" && <Lookbook outfits={outfits} addOutfit={addOutfit} delOutfit={delOutfit}/>}
      </div>

      {editing && <ItemForm value={editing} onSave={saveItem} onCancel={()=>setEditing(null)} onDelete={deleteItem} logClean={logClean}/>}
      {toast && <div style={{position:"fixed",left:"50%",bottom:26,transform:"translateX(-50%)",background:"var(--ink)",color:"#fff",fontSize:12.5,letterSpacing:".04em",padding:"11px 20px",zIndex:60}}>{toast}</div>}
    </div>
  );
}

/* ---------------- closet grid ---------------- */
function Closet({items,onEdit,logWear,exportJSON,importJSON}){
  const [cat,setCat]=useState("All");
  const [sort,setSort]=useState("cpw");
  const fileRef=useRef();
  const cats=["All",...CATS.filter(c=>items.some(i=>i.category===c))];
  let list=items.filter(i=>cat==="All"||i.category===cat);
  list=[...list].sort((a,b)=>
    sort==="cpw" ? (b.cpw===Infinity?1e9:b.cpw)-(a.cpw===Infinity?1e9:a.cpw)
    : sort==="dormant" ? (b.dormant??1e9)-(a.dormant??1e9)
    : sort==="price" ? b.total-a.total
    : a.wears-b.wears);
  return (
    <div>
      <Lead>Everything you own, with what each piece actually costs you per wear. Tap any piece to edit its details, log a wear, or record a cleaning.</Lead>
      <div style={{display:"flex",justifyContent:"space-between",gap:14,flexWrap:"wrap",alignItems:"center",marginBottom:22}}>
        <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
          {cats.map(c=>(
            <button key={c} onClick={()=>setCat(c)} className="hoverlift" style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",
              color:cat===c?"var(--ink)":"var(--faint)",borderBottom:cat===c?"1px solid var(--ink)":"1px solid transparent",paddingBottom:3}}>{c}</button>
          ))}
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <span className="lbl">Sort</span>
          <select value={sort} onChange={e=>setSort(e.target.value)} style={{...inp,padding:"7px 9px",fontSize:12}}>
            <option value="cpw">Highest cost per wear</option>
            <option value="dormant">Longest unworn</option>
            <option value="wears">Fewest wears</option>
            <option value="price">Most invested</option>
          </select>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:"30px 22px"}}>
        {list.map(i=><Card key={i.id} i={i} onEdit={onEdit} logWear={logWear}/>)}
      </div>

      <div style={{marginTop:52,paddingTop:22,borderTop:"1px solid var(--line)",display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
        <span className="lbl">Backup</span>
        <button onClick={exportJSON} style={ghost}>Export closet</button>
        <input ref={fileRef} type="file" accept="application/json" style={{display:"none"}} onChange={e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value="";}}/>
        <button onClick={()=>fileRef.current.click()} style={ghost}>Import backup</button>
        <span style={{fontSize:12,color:"var(--faint)"}}>Your closet lives in this browser. Export now and then so you keep a copy.</span>
      </div>
    </div>
  );
}

function Card({i,onEdit,logWear}){
  return (
    <div>
      <div onClick={()=>onEdit(i)} className="hoverlift" style={{cursor:"pointer",position:"relative"}}>
        <Thumb src={i.img} label={(i.brand||i.name||"?").slice(0,1)}/>
        {i.status==="sell" && <div style={{position:"absolute",top:8,left:8,background:"#fff",padding:"3px 7px"}}><Tag tone="flag">Reconsider</Tag></div>}
      </div>
      <div style={{marginTop:11}}>
        <div style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",fontWeight:600}}>{i.brand||"\u00A0"}</div>
        <div style={{fontSize:13.5,color:"var(--mut)",marginTop:3,lineHeight:1.4}}>{i.name}</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginTop:9,gap:8}}>
          <Money v={i.cpw} size={15}/><span style={{fontSize:11,color:"var(--faint)"}}>per wear</span>
        </div>
        <div style={{fontSize:11,color:"var(--faint)",marginTop:4}}>{i.wears} wears &middot; {lastWornLabel(i)}</div>
        <button onClick={()=>logWear(i.id)} style={{...mini,marginTop:9,width:"100%"}}>Wear today</button>
      </div>
    </div>
  );
}

/* ---------------- get dressed ---------------- */
function Today({items,logWear,onEdit}){
  const s=seasonNow();
  const [seasonOnly,setSeasonOnly]=useState(true);
  const pool=items.filter(i=>!seasonOnly||i.season==="All year"||i.season===s);
  const cats=CATS.filter(c=>pool.some(i=>i.category===c));
  return (
    <div>
      <Lead>Sorted by what you haven&rsquo;t touched in longest, grouped so you can build a whole look: a top, a bottom, a shoe. Logging a wear drops its cost per wear on the spot.</Lead>
      <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:26}}>
        <button onClick={()=>setSeasonOnly(v=>!v)} style={seasonOnly?solid:ghost}>{s} pieces</button>
        <button onClick={()=>setSeasonOnly(v=>!v)} style={seasonOnly?ghost:solid}>Everything</button>
      </div>
      {cats.map(c=>{
        const list=[...pool].filter(i=>i.category===c)
          .sort((a,b)=>(b.dormant??1e9)-(a.dormant??1e9)||a.wears-b.wears).slice(0,4);
        return (
          <div key={c} style={{marginBottom:38}}>
            <SectionRule right={`${list.length} shown`}>{c}</SectionRule>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:"26px 22px"}}>
              {list.map(i=><Card key={i.id} i={i} onEdit={onEdit} logWear={logWear}/>)}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------- underused ---------------- */
function Underused({items,logWear,onEdit}){
  const under=items.filter(i=>i.status==="improve").sort((a,b)=>b.gap-a.gap);
  const proven=items.filter(i=>i.status==="star").sort((a,b)=>b.wears-a.wears);
  return (
    <div>
      <Lead>These carry the highest cost per wear but can still reach their category benchmark. Each shows how many more wears closes the gap.</Lead>
      <SectionRule right={`${under.length} pieces`}>Worth pushing</SectionRule>
      <div style={{border:"1px solid var(--line)",marginBottom:44}}>
        {under.map((i,idx)=>(
          <div key={i.id} style={{display:"flex",gap:14,alignItems:"center",padding:14,borderTop:idx?"1px solid var(--lineSoft)":"none"}}>
            <div style={{width:56,flex:"0 0 auto",cursor:"pointer"}} onClick={()=>onEdit(i)}><Thumb src={i.img} label={(i.brand||i.name).slice(0,1)}/></div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:10.5,letterSpacing:".1em",textTransform:"uppercase",fontWeight:600}}>{i.brand||i.category}</div>
              <div style={{fontSize:13.5,color:"var(--mut)",marginTop:2}}>{i.name}</div>
              <div style={{fontSize:12,marginTop:6}}>{i.gap} more wear{i.gap===1?"":"s"} reaches {money(r2(i.total/i.targetWears))} &middot; benchmark {i.range}</div>
            </div>
            <div style={{textAlign:"right",display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8}}>
              <Money v={i.cpw} size={17}/>
              <button onClick={()=>logWear(i.id)} style={mini}>Wear today</button>
            </div>
          </div>
        ))}
      </div>
      <SectionRule right={`${proven.length} pieces`}>Already earning their keep</SectionRule>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:"26px 22px"}}>
        {proven.map(i=><Card key={i.id} i={i} onEdit={onEdit} logWear={logWear}/>)}
      </div>
    </div>
  );
}

/* ---------------- rotate in ---------------- */
function Rotate({items,logWear}){
  const byCat={}; items.forEach(i=>{(byCat[i.category]=byCat[i.category]||[]).push(i);});
  const blocks=[];
  CATS.forEach(cat=>{
    const list=byCat[cat]; if(!list) return;
    const staples=[...list].filter(i=>i.wears>0).sort((a,b)=>b.wears-a.wears).slice(0,2);
    const cands=[...list].filter(i=>i.cpw>i.mid&&!staples.includes(i)).sort((a,b)=>b.cpw-a.cpw);
    if(staples.length&&cands.length) blocks.push({cat,staples,cands});
  });
  return (
    <div>
      <Lead>The pieces you reach for most prove where heavy rotation happens, so that&rsquo;s where wearing something underused instead pays off fastest.</Lead>
      {blocks.map(b=>(
        <div key={b.cat} style={{marginBottom:44}}>
          <SectionRule right={`you reach for ${b.staples[0].brand||b.staples[0].name}`}>{b.cat}</SectionRule>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:"26px 22px"}}>
            {b.cands.map(c=>{
              const target=b.staples[0].wears;
              const proj=c.total/(c.wears+Math.max(1,target-c.wears));
              return (
                <div key={c.id}>
                  <Thumb src={c.img} label={(c.brand||c.name).slice(0,1)}/>
                  <div style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",fontWeight:600,marginTop:10}}>{c.brand||"\u00A0"}</div>
                  <div style={{fontSize:13,color:"var(--mut)",marginTop:3}}>{c.name}</div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginTop:8,paddingTop:8,borderTop:"1px solid var(--lineSoft)"}}>
                    <Money v={c.cpw} size={14}/><span style={{fontSize:11,color:"var(--faint)"}}>now</span>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginTop:4}}>
                    <span style={{fontSize:14,fontWeight:500,color:"var(--good)"}}>{money(r2(proj))}</span>
                    <span style={{fontSize:11,color:"var(--faint)"}}>at {Math.max(c.wears+1,target)} wears</span>
                  </div>
                  <button onClick={()=>logWear(c.id)} style={{...mini,marginTop:10,width:"100%"}}>Wear today</button>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------------- sell ---------------- */
function Sell({items,onEdit}){
  const list=items.filter(i=>i.status==="sell").sort((a,b)=>b.cpw-a.cpw);
  const recover=list.reduce((s,i)=>s+(+i.resale||0),0);
  return (
    <div>
      <Lead>These can&rsquo;t reach their benchmark within a realistic lifetime of wears; the maths won&rsquo;t bend. Keep the ones you love as exceptions and let the rest go. Add a resale estimate to any piece to see what you&rsquo;d recover.</Lead>
      {recover>0 && <div style={{border:"1px solid var(--line)",padding:"16px 18px",marginBottom:26}}>
        <div className="lbl">Estimated recovery</div>
        <div style={{fontFamily:display,fontSize:28,marginTop:4}}>{money(recover)}</div></div>}
      {list.length===0 ? <Empty>Nothing flagged. Every piece can still reach its benchmark.</Empty> :
      <div style={{border:"1px solid var(--line)"}}>
        {list.map((i,idx)=>(
          <div key={i.id} style={{display:"flex",gap:14,alignItems:"center",padding:14,borderTop:idx?"1px solid var(--lineSoft)":"none"}}>
            <div style={{width:60,flex:"0 0 auto",cursor:"pointer"}} onClick={()=>onEdit(i)}><Thumb src={i.img} label={(i.brand||i.name).slice(0,1)}/></div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:10.5,letterSpacing:".1em",textTransform:"uppercase",fontWeight:600}}>{i.brand||i.category}</div>
              <div style={{fontSize:13.5,color:"var(--mut)",marginTop:2}}>{i.name}</div>
              <div style={{fontSize:11.5,color:"var(--faint)",marginTop:6}}>
                {money(i.total)} spent &middot; {i.wears} wear{i.wears===1?"":"s"} &middot; needs ~{i.targetWears}, realistic ceiling {i.ceil}
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <Money v={i.cpw} size={17}/>
              <div style={{marginTop:7}}>{+i.resale>0
                ? <span style={{fontSize:11.5,color:"var(--good)"}}>{money(+i.resale)} resale</span>
                : <button onClick={()=>onEdit(i)} style={{...mini,fontSize:11}}>Add resale</button>}</div>
            </div>
          </div>
        ))}
      </div>}
    </div>
  );
}

/* ---------------- lookbook ---------------- */
function Lookbook({outfits,addOutfit,delOutfit}){
  const ref=useRef();
  return (
    <div>
      <Lead>Outfits you want to remember. Scroll it when nothing feels right. Photos stay on this device.</Lead>
      <div style={{marginBottom:24}}>
        <input ref={ref} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>{[...e.target.files].forEach(addOutfit);e.target.value="";}}/>
        <button onClick={()=>ref.current.click()} style={solid}>Add photos</button>
      </div>
      {outfits.length===0 ? <Empty>No looks saved yet.</Empty> :
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:14}}>
        {outfits.map(o=>(
          <div key={o.id} style={{position:"relative"}}>
            <img src={o.src} alt="" style={{width:"100%",aspectRatio:"3 / 4",objectFit:"cover",display:"block"}}/>
            <button onClick={()=>delOutfit(o.id)} style={{position:"absolute",top:8,right:8,width:26,height:26,background:"#fff",fontSize:15,lineHeight:"24px"}}>×</button>
          </div>
        ))}
      </div>}
    </div>
  );
}

/* ---------------- add / edit ---------------- */
function ItemForm({value,onSave,onCancel,onDelete,logClean}){
  const isNew=value.id==null;
  const [v,setV]=useState({brand:"",name:"",category:"Tops",price:"",care:"",cleanCost:"",resale:"",season:"All year",baseWears:0,img:"",...value});
  const fileRef=useRef();
  const set=(k,val)=>setV(s=>({...s,[k]:val}));
  const wearsShown=(+v.baseWears||0)+((value.history||[]).length);
  async function pick(f){ try{ set("img",await fileToThumb(f,700,.85)); }catch(e){} }
  return (
    <div onClick={onCancel} style={{position:"fixed",inset:0,background:"rgba(17,17,17,.35)",zIndex:50,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"5vh 16px"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",width:"100%",maxWidth:520,padding:26,border:"1px solid var(--line)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
          <div style={{fontFamily:display,fontSize:24}}>{isNew?"Add a piece":"Edit piece"}</div>
          <button onClick={onCancel} style={{fontSize:20,color:"var(--faint)"}}>×</button>
        </div>

        <div style={{display:"flex",gap:14,marginTop:20}}>
          <div style={{width:96,flex:"0 0 auto"}}>
            <Thumb src={v.img} label="+"/>
            <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{if(e.target.files[0])pick(e.target.files[0]);e.target.value="";}}/>
            <button onClick={()=>fileRef.current.click()} style={{...mini,width:"100%",marginTop:7}}>Photo</button>
          </div>
          <div style={{flex:1,display:"flex",flexDirection:"column",gap:10}}>
            <Field label="Brand"><input value={v.brand} onChange={e=>set("brand",e.target.value)} placeholder="Issey Miyake" style={inp}/></Field>
            <Field label="Piece"><input value={v.name} onChange={e=>set("name",e.target.value)} placeholder="Pleated trousers" style={inp}/></Field>
          </div>
        </div>

        <div style={{marginTop:12}}>
          <Field label="Image URL (optional)"><input value={(v.img||"").startsWith("data:")?"":v.img} onChange={e=>set("img",e.target.value)} placeholder="https://…" style={inp}/></Field>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:12}}>
          <Field label="Category">
            <select value={v.category} onChange={e=>set("category",e.target.value)} style={inp}>{CATS.map(c=><option key={c}>{c}</option>)}</select>
          </Field>
          <Field label="Season">
            <select value={v.season} onChange={e=>set("season",e.target.value)} style={inp}>{SEASONS.map(c=><option key={c}>{c}</option>)}</select>
          </Field>
          <Field label="Price paid"><input type="number" value={v.price} onChange={e=>set("price",e.target.value)} style={inp}/></Field>
          <Field label="Care spent so far"><input type="number" value={v.care} onChange={e=>set("care",e.target.value)} style={inp}/></Field>
          <Field label="Cost per cleaning"><input type="number" value={v.cleanCost} onChange={e=>set("cleanCost",e.target.value)} style={inp}/></Field>
          <Field label="Resale estimate"><input type="number" value={v.resale} onChange={e=>set("resale",e.target.value)} style={inp}/></Field>
          <Field label="Wears before tracking"><input type="number" value={v.baseWears} onChange={e=>set("baseWears",e.target.value)} style={inp}/></Field>
          <Field label="Total wears"><div style={{...inp,background:"var(--soft)",color:"var(--mut)"}}>{wearsShown}</div></Field>
        </div>

        {!isNew && +v.cleanCost>0 &&
          <button onClick={()=>{logClean(v.id);set("care",(+v.care||0)+(+v.cleanCost||0));}} style={{...ghost,marginTop:14,width:"100%"}}>
            Log a cleaning (+{money(+v.cleanCost)})
          </button>}

        <div style={{display:"flex",gap:10,marginTop:22,flexWrap:"wrap"}}>
          <button onClick={()=>onSave({...v,price:+v.price||0,care:+v.care||0,cleanCost:+v.cleanCost||0,resale:+v.resale||0,baseWears:+v.baseWears||0})} style={{...solid,flex:1}}>
            {isNew?"Add to closet":"Save changes"}</button>
          {!isNew && <button onClick={()=>onDelete(v.id)} style={{...ghost,color:"var(--flag)",borderColor:"var(--flag)"}}>Remove</button>}
        </div>
      </div>
    </div>
  );
}
function Field({label,children}){
  return <label style={{display:"block"}}><div className="lbl" style={{marginBottom:5}}>{label}</div>{children}</label>;
}

/* ---------------- styles ---------------- */
const inp={width:"100%",padding:"9px 11px",border:"1px solid var(--line)",background:"#fff",borderRadius:0,fontSize:13.5,outline:"none"};
const solid={fontSize:11.5,letterSpacing:".12em",textTransform:"uppercase",color:"#fff",background:"var(--ink)",padding:"12px 20px"};
const ghost={fontSize:11.5,letterSpacing:".12em",textTransform:"uppercase",color:"var(--ink)",background:"transparent",border:"1px solid var(--ink)",padding:"11px 18px"};
const mini={fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"var(--ink)",background:"transparent",border:"1px solid var(--line)",padding:"8px 10px"};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
